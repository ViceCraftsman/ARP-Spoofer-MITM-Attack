name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ARP-Spoofer-MITM-Attack.sln
      - name: Build
        run: dotnet build ARP-Spoofer-MITM-Attack.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test ARP-Spoofer-MITM-Attack.sln --no-build --configuration Release
      - name: Publish
        run: dotnet publish src/ARP-Spoofer-MITM-Attack/ARP-Spoofer-MITM-Attack.csproj --configuration Release --no-build --output ./artifacts
